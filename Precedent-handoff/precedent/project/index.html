<style>
  html, body {
    background: #050505;
    color: #FDFBF7;
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
    letter-spacing: -0.005em;
  }
  ::selection { background: rgba(16,185,129,0.25); color: #FDFBF7; }

  /* Double-bezel inner highlight */
  .bezel-inner-shadow {
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.15), inset 0 0 0 1px rgba(255,255,255,0.02);
  }
  /* Ambient lift for the whole bezel */
  .bezel-lift {
    box-shadow:
      0 30px 60px -30px rgba(0,0,0,0.6),
      0 20px 40px -15px rgba(0,0,0,0.4);
  }

  /* Soft, low-chroma emerald vignette */
  .vignette {
    background:
      radial-gradient(ellipse 60% 50% at 50% 55%, rgba(16,185,129,0.06), rgba(16,185,129,0) 60%),
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(16,185,129,0.025), rgba(16,185,129,0) 70%);
    pointer-events: none;
  }

  /* Subtle scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); background-clip: content-box; border: 2px solid transparent; }

  textarea, input { font-family: inherit; }
  textarea { resize: none; }

  /* Subtle “status pulse” for the live progress dot */
  @keyframes softPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.92); }
  }
  .status-dot { animation: softPulse 2.4s ease-in-out infinite; }

  /* Tactile CTA */
  .cta {
    transition: transform .18s cubic-bezier(.2,.7,.2,1), background-color .2s ease;
    will-change: transform;
  }
  .cta:active { transform: scale(0.98); }
  .cta .cta-icon { transition: transform .22s cubic-bezier(.2,.7,.2,1); }
  .cta:hover .cta-icon { transform: translate(3px, -1px); }

  /* Screen transition */
  .screen-enter {
    animation: screenEnter .55s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes screenEnter {
    0% { opacity: 0; transform: translateY(8px); filter: blur(8px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* Active sidebar item dot */
  .nav-dot {
    width: 5px; height: 5px; border-radius: 999px;
    background: #10B981;
    box-shadow: 0 0 0 3px rgba(16,185,129,0.18);
  }

  /* Hairline */
  .hairline { border-color: rgba(255,255,255,0.06); }

  /* Caret tint */
  textarea, input { caret-color: #10B981; }

  /* Focused field ring (custom, since Tailwind class is fine but we want offset zero) */
  .field:focus { outline: none; box-shadow: 0 0 0 1px rgba(16,185,129,0.5), inset 0 0 0 1px rgba(255,255,255,0.06); }
</style>
