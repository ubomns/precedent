<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Precedent — Brief Intake</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .intake-page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 24px 48px;
      overflow-x: hidden;
    }
    .vignette {
      position: fixed;
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(16,185,129,0.06) 0%, transparent 70%);
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .nav-pill {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 24px;
      margin-top: 8px;
      padding: 10px 24px;
    }
    .nav-pill .wordmark {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .nav-pill .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
      font-size: 0.8rem;
    }
    .nav-pill .nav-links a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .nav-pill .nav-links a:hover { color: var(--fg); }
    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 56px;
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      max-width: 20ch;
    }
    .hero p {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 55ch;
      line-height: 1.5;
    }
    .form-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
    }
    .form-card .double-bezel-inner {
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 40px;
    }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-row { display: flex; gap: 16px; }
    .field-row > * { flex: 1; }
    .stakeholder-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .stakeholder-row input { flex: 1; }
    .stakeholder-row .btn-remove {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1rem;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .stakeholder-row .btn-remove:hover { background: rgba(244,63,94,0.10); color: #fb7185; border-color: rgba(244,63,94,0.20); }
    .btn-add {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px dashed rgba(255,255,255,0.15);
      color: var(--muted);
      border-radius: 9999px;
      padding: 8px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
      margin-top: 4px;
    }
    .btn-add:hover { border-color: var(--accent); color: var(--accent); }
    .generate-btn {
      width: 100%;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    .generate-btn .trailing-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      display: grid;
      place-items: center;
    }
    .footer {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding-top: 40px;
      font-size: 0.8rem;
      color: #52525b;
    }
    @media (max-width: 640px) {
      .field-row { flex-direction: column; }
      .form-card .double-bezel-inner { padding: 24px; }
      .stakeholder-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="intake-page">
    <div class="vignette"></div>

    <nav class="nav-pill glass">
      <span class="wordmark">Precedent</span>
      <ul class="nav-links">
        <li><a href="intake.html">Intake</a></li>
        <li><a href="review.html">Review</a></li>
        <li><a href="review.html">Export</a></li>
      </ul>
    </nav>

    <header class="hero">
      <div class="eyebrow">Business Requirements Document Generator</div>
      <h1>From brief to BRD.</h1>
      <p>Enter what only you know. We'll handle the structure.</p>
    </header>

    <section class="form-card double-bezel">
      <div class="double-bezel-inner">
        <div class="field-group">
          <label class="label">Project Objective</label>
          <textarea class="textarea" rows="4" placeholder="Describe the core objective and expected outcome..."></textarea>
        </div>

        <div class="field-group">
          <label class="label">Stakeholders</label>
          <div id="stakeholders">
            <div class="stakeholder-row">
              <input class="input" placeholder="Name" />
              <input class="input" placeholder="Role" />
              <button type="button" class="btn-remove" aria-label="Remove">×</button>
            </div>
          </div>
          <button type="button" class="btn-add" id="add-stakeholder">+ Add stakeholder</button>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label class="label">Scope In</label>
            <textarea class="textarea" rows="3" placeholder="What's included..."></textarea>
          </div>
          <div class="field-group">
            <label class="label">Scope Out</label>
            <textarea class="textarea" rows="3" placeholder="What's excluded..."></textarea>
          </div>
        </div>

        <div class="field-group">
          <label class="label">Target Users</label>
          <input class="input" placeholder="e.g. Internal compliance team, retail customers" />
        </div>

        <div class="field-group">
          <label class="label">Regulatory Context</label>
          <textarea class="textarea" rows="3" placeholder="Relevant regulations, standards, or governance frameworks..."></textarea>
        </div>

        <button type="button" class="btn-pill generate-btn" id="generate-brd">
          <span>Generate BRD</span>
          <span class="trailing-icon">→</span>
        </button>
      </div>
    </section>

    <footer class="footer">Precedent v1 · 2026</footer>
  </div>

  <script>
    const stakeholders = document.getElementById('stakeholders');
    const addBtn = document.getElementById('add-stakeholder');

    function createRow() {
      const row = document.createElement('div');
      row.className = 'stakeholder-row';
      row.innerHTML = `
        <input class="input" placeholder="Name" />
        <input class="input" placeholder="Role" />
        <button type="button" class="btn-remove" aria-label="Remove">×</button>
      `;
      row.querySelector('.btn-remove').addEventListener('click', () => row.remove());
      return row;
    }

    addBtn.addEventListener('click', () => {
      stakeholders.appendChild(createRow());
    });

    stakeholders.querySelector('.btn-remove').addEventListener('click', (e) => {
      const rows = stakeholders.querySelectorAll('.stakeholder-row');
      if (rows.length > 1) e.target.closest('.stakeholder-row').remove();
    });

    document.getElementById('generate-brd').addEventListener('click', () => {
      window.location.href = 'review.html';
    });
  </script>
</body>
</html>
